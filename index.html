<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: 한 손 모바일 게임판 — 상단 고정 상태바, 가운데 단계 카드 하나, 유사도는 '온도계'(차가움→뜨거움)로 표현 */
:root{
  --bg:#161331; --surface:#211d46; --surface2:#2b2659; --line:#3b3572;
  --fg:#f6f3ff; --muted:#c3bde6; --dim:#918bbd;
  --cold:#59a8ff; --warm:#ffb347; --hot:#ff4f61; --ok:#3ddc97;
  --accent:#ff6a5a;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-num:"Space Grotesk","IBM Plex Sans KR",ui-monospace,sans-serif;
  --r:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:17px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:520px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;display:flex;align-items:center;gap:8px}
.prog{position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:5;height:4px;background:var(--line);border-radius:99px;margin-bottom:14px;overflow:hidden}
.prog i{display:block;height:100%;width:100%;background:var(--warm);border-radius:99px;transition:width .25s linear}
.prog i.low{background:var(--hot)}
.prog.none{background:var(--line)}
.mark{font-family:var(--f-display);font-size:17px;letter-spacing:.5px;line-height:1;white-space:nowrap}
.mark b{color:var(--accent);font-weight:400}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;flex:0 0 auto;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.chip strong{color:var(--fg);font-weight:700}
.sp{flex:1}
.timer{font-family:var(--f-num);font-weight:700;font-size:15px;color:var(--fg);padding:5px 11px;border-radius:999px;background:var(--surface2)}
.timer.low{background:var(--hot);color:#fff}

/* scores strip */
.scores{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.scores::-webkit-scrollbar{display:none}
.sc{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:var(--surface);font-size:13px}
.sc .n{font-family:var(--f-num);font-weight:700}
.sc.me{outline:1.5px solid var(--warm)}
.sc.giver{background:var(--surface2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.dot.off{background:var(--dim)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:700}
.title{font-family:var(--f-display);font-size:28px;line-height:1.15;font-weight:400}
.big{font-family:var(--f-display);font-size:44px;line-height:1.05;font-weight:400;word-break:keep-all}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.center{text-align:center}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:0 20px;border-radius:14px;border:0;background:var(--accent);color:#1a0d10;font-weight:700;font-size:17px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.soft{background:var(--surface2);color:var(--fg)}
.btn.sm{min-height:40px;font-size:14px;padding:0 14px;width:auto;border-radius:11px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.in{width:100%;min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:0 16px;font-size:19px;outline:none}
.in:focus{border-color:var(--warm)}
.in.code{font-family:var(--f-num);letter-spacing:.3em;text-transform:uppercase;text-align:center;font-size:24px;font-weight:700}
.combo{display:flex;gap:8px}
.combo .in{flex:1;min-width:0}
.combo .btn{width:auto;flex:0 0 auto}
select.in{font-size:16px;appearance:auto}

/* similarity meter */
.meter{position:relative;height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--cold),var(--warm) 60%,var(--hot))}
.meter .t95{position:absolute;top:-2px;bottom:-2px;left:95%;width:2px;background:var(--fg);opacity:.6}
.try{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.try:first-child{border-top:0}
.try .w{font-weight:700;font-size:18px;min-width:0;overflow-wrap:anywhere}
.try .s{font-family:var(--f-num);font-weight:700;font-size:20px}
.try .meter,.try .note{grid-column:1/-1}
.try .note{font-size:13px;color:var(--muted)}
.try.bad .w{text-decoration:line-through;color:var(--dim)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);vertical-align:middle;margin-left:6px;letter-spacing:.02em}
.tag.hot{background:var(--hot);color:#fff}
.tag.ok{background:var(--ok);color:#06281a}

/* revealed hint tile */
.hint-tiles{display:grid;gap:10px}
.tile{border-radius:var(--r);padding:16px 18px;background:var(--surface2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.tile .w{font-family:var(--f-display);font-size:34px;line-height:1.1;font-weight:400;min-width:0;overflow-wrap:anywhere}
.tile .s{font-family:var(--f-num);font-size:26px;font-weight:700}
.tile .lb{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}

/* envelope */
.env{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.wc{min-height:72px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-family:var(--f-display);font-size:24px;font-weight:400}
.wc[aria-pressed="true"]{border-color:var(--warm);background:var(--surface2);box-shadow:0 0 0 3px color-mix(in srgb,var(--warm) 30%,transparent)}
.wc:last-child:nth-child(odd){grid-column:1/-1}

/* secret */
.secret{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:14px;background:var(--bg);border:1px dashed var(--line)}
.secret .w{font-family:var(--f-display);font-size:26px;font-weight:400}
.secret .w.mask{letter-spacing:.2em;color:var(--dim)}

/* list */
.plist{display:flex;flex-direction:column}
.pl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl .nm{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.pl .st{font-size:13px;color:var(--muted)}
.pl .st.ok{color:var(--ok);font-weight:700}

.banner{border-radius:var(--r);padding:16px 18px;font-weight:700;font-size:17px}
.banner.win{background:color-mix(in srgb,var(--ok) 18%,var(--surface));border:1px solid var(--ok)}
.banner.lose{background:color-mix(in srgb,var(--hot) 16%,var(--surface));border:1px solid var(--hot)}
.banner.info{background:var(--surface2)}

.res{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.res:first-child{border-top:0}
.res .who{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.gw{display:flex;align-items:center;gap:10px}
.gw .w{flex:1;min-width:0;overflow-wrap:anywhere}
.gw .s{font-family:var(--f-num);font-weight:700}

.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--warm);animation:spin .8s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.pulse,.spin{animation:none}}

details.rules{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 18px}
details.rules summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.rules summary::after{content:"+";color:var(--muted);font-size:20px;line-height:1}
details.rules[open] summary::after{content:"−"}
details.rules ol,details.rules ul{padding-left:20px;margin:0 0 14px;display:flex;flex-direction:column;gap:6px}
details.rules p{margin:0 0 12px}

.podium{display:flex;flex-direction:column;gap:8px}
.pd{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--surface2)}
.pd .rk{font-family:var(--f-num);font-weight:700;font-size:22px;width:28px}
.pd .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.pd .n{font-family:var(--f-num);font-weight:700;font-size:22px}
.pd.first{background:linear-gradient(90deg,color-mix(in srgb,var(--warm) 35%,var(--surface2)),var(--surface2))}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set{display:flex;flex-direction:column;gap:4px}
.set label{font-size:12px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0}
.chk input{width:22px;height:22px;accent-color:var(--warm)}
.hero{padding:26px 0 8px}
.hero .big span{color:var(--accent)}
.now{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--surface2);font-size:16px;font-weight:500;line-height:1.45}
.now .lb{flex:0 0 auto;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--line);color:var(--fg);margin-top:1px}
.now.mine{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border:1.5px solid var(--accent)}
.now.mine .lb{background:var(--accent);color:#1a0d10}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stg{padding:8px 6px;border-radius:10px;background:var(--bg);text-align:center;font-size:13px;color:var(--dim);border:1px solid var(--line)}
.stg b{display:block;font-family:var(--f-num);font-size:16px;color:var(--muted)}
.stg.on{border-color:var(--warm);color:var(--fg);background:var(--surface2)}
.stg.on b{color:var(--warm)}
.stg.past{opacity:.55}
.steps{display:grid;gap:10px;counter-reset:st}
.steps li{list-style:none;display:flex;gap:12px;align-items:flex-start}
.steps li::before{counter-increment:st;content:counter(st);flex:0 0 26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:14px;color:var(--warm)}
.steps{padding:0;margin:0}
.fine{font-size:13px;color:var(--dim)}
.log{display:flex;flex-direction:column;gap:8px}
.lg{padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14px}
.lg b{font-family:var(--f-display);font-weight:400;font-size:18px}
</style>

<script>
"use strict";
/* ================= 기본 도구 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("hw:"+k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("hw:"+k, JSON.stringify(v)); }catch{} },
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));

/* 정규화: 띄어쓰기·특수문자 제거, 영문 소문자, 한글 NFC */
const norm = w => String(w || "").normalize("NFC").toLowerCase()
  .replace(/[\s​-‍﻿]+/g, "").replace(/[^0-9a-zㄱ-ㆎ가-힣]/g, "");

function checkWord(raw, {english=false, kind="힌트"} = {}){
  const w = norm(raw);
  if(!w) return {err:`${kind} 단어를 입력해 주세요`};
  if(/[ㄱ-ㆎ]/.test(w)) return {err:"ㅋ·ㅏ 같은 낱자 말고 완성된 글자로 써 주세요"};
  if(/[0-9]/.test(w)) return {err:"숫자는 쓸 수 없어요"};
  if(!english && /[a-z]/.test(w)) return {err:"이 방은 한글 단어만 받아요 (방 설정에서 영어 허용 가능)"};
  if(/[a-z]/.test(w) && /[가-힣]/.test(w)) return {err:"한글과 영어를 섞지 말아 주세요"};
  if(w.length > (/[a-z]/.test(w) ? 20 : 10)) return {err:"단어가 너무 길어요"};
  return {w};
}
const cleanNick = n => String(n || "").replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮]/g, "").trim().slice(0, 10);

/* 가벼운 가림막(친구끼리 개발자도구로 슬쩍 보는 것 방지용, 보안 아님) */
function obf(s, key){
  const k = new TextEncoder().encode("hw" + key), b = new TextEncoder().encode(String(s));
  let out = ""; b.forEach((x, i) => out += String.fromCharCode(x ^ k[i % k.length])); return btoa(out);
}
function deobf(s, key){
  try{ const k = new TextEncoder().encode("hw" + key); const b = Uint8Array.from(atob(s), c => c.charCodeAt(0));
    return new TextDecoder().decode(b.map((x, i) => x ^ k[i % k.length])); }catch{ return ""; }
}
function hashStr(s){ let h = 2166136261; for(const c of s){ h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r = Math.random){ const a = arr.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ================= 단어 봉투 (고유명사 아닌 일반 명사) ================= */
const WORDS = ("나무 바다 우산 우비 공항 수영 대기 화가 우유 요리사 서점 대화 전복 눈 배 말 밤 차 다리 감 김 벌 비 사과 병 손 발 시계 거울 편지 기차 자전거 냉장고 도서관 병원 학교 운동장 사막 화산 무지개 구름 번개 별 달 태양 지도 나침반 열쇠 자물쇠 의자 침대 베개 이불 커피 라면 김치 떡볶이 치킨 피자 케이크 초콜릿 사탕 아이스크림 수박 딸기 바나나 포도 감자 고구마 당근 양파 마늘 소금 설탕 간장 가위 연필 지우개 공책 칠판 사진 카메라 영화 노래 피아노 기타 춤 축구 야구 농구 스키 텐트 캠핑 등산 낚시 요트 섬 항구 등대 파도 모래 조개 고래 상어 문어 거북이 펭귄 사자 호랑이 코끼리 기린 원숭이 고양이 강아지 토끼 여우 늑대 곰 독수리 비둘기 나비 거미 개미 꽃 장미 해바라기 단풍 눈사람 생일 선물 풍선 결혼 반지 왕관 성 기사 마법사 해적 유령 천사 악마 로봇 우주 외계인 로켓 비행기 잠수함 소방관 경찰 의사 간호사 선생님 학생 군인 농부 어부 가수 배우 기자 변호사 판사 감옥 법원 은행 시장 백화점 편의점 지하철 버스 택시 신호등 엘리베이터 계단 지붕 창문 문 벽 정원 수영장 목욕 샴푸 칫솔 수건 안경 모자 장갑 목도리 신발 양말 가방 지갑 돈 동전 시험 숙제 졸업 여행 여권 호텔 휴가 겨울 여름 봄 가을 새벽 노을 그림자 꿈 거짓말 비밀 약속 사랑 우정 질투 행운 전쟁 평화 역사 미래 시간 기억 컴퓨터 휴대폰 인터넷 게임 이메일 배터리 전기 자석 불꽃 연기 얼음 온천 화장실 쓰레기 청소 빨래 감기 주사 약 피 심장 뼈 머리카락 이빨 웃음 눈물 박수 바람 그네 시소 미끄럼틀 연 팽이 거품 비누 향수 립스틱 화분 씨앗 열매 뿌리 줄기 잎 숲 강 호수 폭포 동굴 절벽 언덕 들판 논 밭 소 돼지 닭 오리 말벌 모기 파리 박쥐 부엉이 앵무새 공룡 화석 보물 지진 태풍 홍수 가뭄 안개 서리 이슬 천둥 북극 남극").split(" ");

const DEFAULTS = {rounds:2, maxTries:10, hintSec:300, guessSec:120, chances:1, english:false, lenient:true, ai:"auto"};

/* ================= 상태 ================= */
const S = {
  ready:false, noRuntime:false, demo:false,
  db:null, room:null, user:null, sample:null,
  uid:null, canWrite:null,

/* ================= AI 유사도 (v2: 뜻 펼치기 + 연상 경로 + 글자 겹침) =================
   최종 점수 = 의미 점수(연상 경로)와 글자 점수(겹치는 글자) 중 높은 쪽 + 둘 다 높을 때 가산.
   · 의미 점수: Claude가 정답의 모든 뜻(동음이의어·한자 구성·복합어·번역)에서 후보까지
     가장 강한 연상 경로를 찾고, 각 고리의 강도 s를 매긴다. 점수 = 100 × Π s × 0.85^(고리수-1)
     → 고리가 길어질수록 자연스럽게 식는다(유성→유성매직→마법→해리포터).

const HOP_DECAY = 0.85;
const roundHalf = x => Math.max(0, Math.min(100, Math.round(Number(x) * 2) / 2));
const aiOpts = mode => mode === "fast" ? {modelTier:"quick"} : {modelTier:"default", effort:"low"};
const syl = w => [...w];

function surfaceScore(ans, w){
  if(!ans || !w) return 0;
  if(w === ans) return 100;
  const k = ans.length >= 2 ? 1 : 0.85;                                // 한 글자 정답(배·눈)은 우연히 겹치기 쉬워 약하게
  if(w.includes(ans)) return k * (60 + 30 * (ans.length / w.length));  // 소나무⊃나무 80, 유성매직⊃유성 75, 배터리⊃배 59.5
  if(ans.includes(w)) return k * (50 + 30 * (w.length / ans.length));  // 유성⊃성 65, 아이스크림⊃크림 62
  const a = syl(ans), b = syl(w), pool = a.slice(); let common = 0;
  for(const c of b){ const i = pool.indexOf(c); if(i >= 0){ common++; pool.splice(i, 1); } }
  return 60 * (2 * common / (a.length + b.length));                  // 별성↔유성 30
}
function pathScore(path, s){
  if(!Array.isArray(s) || !s.length) return 3;
  const links = s.slice(0, 4).map(x => Math.max(0, Math.min(1, Number(x) || 0)));
  const prod = links.reduce((p, x) => p * x, 1) * Math.pow(HOP_DECAY, links.length - 1);
  return Math.max(0, Math.min(99, prod * 100));
}
function combine(sem, surf){
  const hi = Math.max(sem, surf), lo = Math.min(sem, surf);
  return roundHalf(Math.min(99, hi + (lo >= 50 ? (lo - 50) * 0.1 : 0)));
}

async function aiPaths(answer, profile, words, english, mode){
  if(!S.sample) throw {code:"no_ai"};
  const out = {};

  const arr = await S.sample.json(pathPrompt(answer, profile, words, english), {...aiOpts(mode), cache:{gcTime:86400000}});
  if(!Array.isArray(arr)) throw {code:"invalid_json"};
  words.forEach((w, i) => {
    const x = arr.find(o => norm(o?.w) === w) || arr[i] || {};
    const same = !!x.same || w === norm(answer);
    const path = (Array.isArray(x.path) ? x.path : [answer, w]).slice(0, 5).map(v => String(v).slice(0, 15));
    const sem = same ? 100 : pathScore(path, x.s);
    const surf = surfaceScore(norm(answer), w);
    out[w] = {same, valid: !same && x.valid !== false, reason: same ? "정답과 같은 단어(번역·표기 변형 포함)" : String(x.reason || "").slice(0, 40),
      s: same ? 100 : combine(sem, surf), sem: roundHalf(sem), surf: roundHalf(surf), path, why: String(x.why || "").slice(0, 50)};
  });
  return out;
}

/* ================= 내장 사전 채점 (Claude 없이) =================

let DICT = null, dictP = null;
function loadDict(){
  if(DICT) return Promise.resolve(DICT);

    .then(d => { DICT = d; return d; }).catch(() => { dictP = null; throw {code:"no_dict"}; });
  return dictP;
}
const inDict = w => !!DICT?.[norm(w)];
function dictScore(answer, w){
  const a = norm(answer), e = DICT?.[a]?.r || {}, he = DICT?.[w]?.r;
  let sem = null, path = null;
  const take = (v, p) => { if(v != null && (sem == null || v > sem)){ sem = v; path = p; } };
  take(e[w], [a, w]);
  if(he) take(he[a], [a, w]);
  // 정답과 붙여 복합어가 되는 조각(대기+열=대기열, 눈+사람=눈사람)은 그 복합어 점수에서 조금 식혀서
  for(const c of [a + w, w + a]) if(e[c] != null && e[c] < 100) take(e[c] * 0.93, [a, c, w]);
  for(const [m, s1] of Object.entries(e)){
    if(s1 < 55 || !DICT[m]) continue;
    const s2 = DICT[m].r[w]; if(s2 != null) take(s1 * s2 / 100 * HOP_DECAY, [a, m, w]);
  }

  return {same, valid: !same, reason: same ? "정답과 같은 단어(번역·표기 변형 포함)" : "",
    s: same ? 100 : combine(semV, surf), sem: roundHalf(semV), surf: roundHalf(surf),

}

async function makeStandalone(){
  try{ await loadScript("https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"); }catch{ return null; }

  let client = null;
  for(const url of MQ_BROKERS){
    try{
      client = await new Promise((res, rej) => {
        const c = window.mqtt.connect(url, {clientId:"hw_" + peerId, reconnectPeriod:1500, connectTimeout:6000, clean:true, keepalive:10});
        c.__url = url;
        const t = setTimeout(() => { c.end(true); rej(); }, 6000);

  const handlers = []; // {filter, fn}
  const match = (f, t) => { const a = f.split("/"), b = t.split("/"); if(a.length !== b.length) return false; return a.every((x, i) => x === "+" || x === b[i]); };
  client.on("message", (topic, buf, packet) => {

    handlers.slice().forEach(h => { if(match(h.filter, topic)) h.fn(data, topic, !!packet?.retain); });
  });
  client.on("connect", () => { [...new Set(handlers.map(h => h.filter))].forEach(f => client.subscribe(f, {qos:1})); });
  const listen = (filter, fn) => { const h = {filter, fn}; handlers.push(h); client.subscribe(filter, {qos:1}); return () => { const i = handlers.indexOf(h); if(i >= 0) handlers.splice(i, 1); if(!handlers.some(x => x.filter === filter)) client.unsubscribe(filter); }; };
  const pub = (topic, obj) => new Promise((res, rej) => client.publish(topic, obj == null ? "" : JSON.stringify(obj), {qos:1, retain:true}, e => e ? rej({code:"unavailable"}) : res()));
  const mkSnap = (id, d) => ({id, exists: d != null, data: () => d == null ? undefined : clone(d), metadata:{fromCache:false, hasPendingWrites:false}});

  /* db: 공유 문서는 중계 서버의 '보관 메시지', 개인 문서(data/users/...)는 이 기기 저장소 */
  const db = {doc(path){
    const id = path.split("/").pop();
    if(path.startsWith("data/users/")){
      const k = "doc:" + path;
      return {path, get: async () => mkSnap(id, LS.get(k, null)), set: async d => LS.set(k, clone(d)), update: async d => LS.set(k, {...LS.get(k, {}), ...d}), delete: async () => LS.set(k, null),
        onSnapshot(next){ setTimeout(() => next(mkSnap(id, LS.get(k, null))), 0); return () => {}; }};
    }
    const topic = `${MQ_ROOT}/${path}`;
    return {path,
      set: d => pub(topic, d), update: d => pub(topic, d), delete: () => pub(topic, null),
      get: () => new Promise(res => { let done = false; const off = listen(topic, d => { if(done) return; done = true; off(); res(mkSnap(id, d)); }); setTimeout(() => { if(!done){ done = true; off(); res(mkSnap(id, null)); } }, 3000); }),
      onSnapshot(next){
        let got = false;
        const off = listen(topic, d => { got = true; next(mkSnap(id, d)); });
        setTimeout(() => { if(!got) next(mkSnap(id, null)); }, 4500);
        return off;
      }};
  }};

  /* room: 참가자 상태(presence)를 방별 보관 메시지로 올리고 5초마다 살아 있음을 알린다 */
  let myPres = {}, code = null, offP = null, peers = Object.freeze([]), last = {}, pubT = 0;
  const peerMap = new Map(), phs = [];
  const emit = () => { peers = Object.freeze([...peerMap.values()]); phs.forEach(h => { try{ h({peers}); }catch{} }); };
  const meEntry = () => Object.freeze({peer:peerId, by:uid, isMe:true, sameTab:true, kind:"viewer", guest:false, presence:Object.freeze({...myPres}), updatedAt: last[peerId] || Date.now()});
  const ptopic = c => `${MQ_ROOT}/hwp/${c}/${peerId}`;
  const sendPres = () => { if(code && client.connected) client.publish(ptopic(code), JSON.stringify({by:uid, ts:Date.now(), p:myPres}), {qos:0, retain:false}); };
  const schedule = () => { clearTimeout(pubT); pubT = setTimeout(sendPres, 80); };
  function setCode(c){
    if(c === code) return;
    if(code){ offP?.(); offP = null; }
    [...peerMap.keys()].forEach(k => k !== peerId && peerMap.delete(k));
    code = c || null;
    if(code) offP = listen(`${MQ_ROOT}/hwp/${code}/+`, (d, topic, retained) => {
      const pid = topic.split("/").pop(); if(pid === peerId || retained) return;
      if(!d){ if(peerMap.delete(pid)) emit(); return; }
      const old = peerMap.get(pid), pr = Object.freeze({...(d.p || {})});
      const changed = !old || JSON.stringify(old.presence) !== JSON.stringify(pr);
      peerMap.set(pid, Object.freeze({peer:pid, by: typeof d.by === "string" ? d.by.slice(0, 40) : null, isMe:false, sameTab:false, kind:"viewer", guest:false, presence:pr, updatedAt: changed ? Date.now() : old.updatedAt, seen: Date.now()}));
      if(changed || !old) emit();
    });
  }
  setInterval(() => { sendPres(); let ch = false; for(const [k, v] of peerMap) if(k !== peerId && Date.now() - v.seen > 12000){ peerMap.delete(k); ch = true; } if(ch) emit(); }, 3000);
  addEventListener("pagehide", () => { if(code && client.connected) client.publish(ptopic(code), "", {qos:0, retain:false}); });
  // 휴대폰에서 카톡 등으로 나갔다 돌아오면 바로 다시 연결하고 신호를 보낸다
  let hidAt = 0;
  document.addEventListener("visibilitychange", () => {
    if(document.hidden){ hidAt = Date.now(); return; }
    const away = hidAt ? Date.now() - hidAt : 0; hidAt = 0;
    if(away > 3000 || !client.connected){
      try{ client.end(true, {}, () => { try{ client.reconnect(); }catch{} }); }catch{ try{ client.reconnect(); }catch{} }
    }
    setTimeout(sendPres, 800); setTimeout(sendPres, 2500);
  });
  client.on("connect", () => setTimeout(sendPres, 200));
  const room = {
    async presence(patch){
      myPres = {...myPres, ...patch}; for(const k in patch) if(patch[k] === null) delete myPres[k];
      last[peerId] = Date.now();
      if("g" in patch) setCode(myPres.g || null);
      peerMap.set(peerId, meEntry()); emit(); schedule();
    },
    peers: () => peers,
    onPeers(h){ phs.push(h); setTimeout(() => h({peers}), 0); return () => { const i = phs.indexOf(h); if(i >= 0) phs.splice(i, 1); }; },
    connected: () => client.connected,
    info: () => ({server: /emqx/.test(client.__url || client.options?.href || "") ? "EMQX" : "HiveMQ", peers: peerMap.size}),
  };
  client.__url = client.__url || MQ_BROKERS.find(u => client.options && String(client.options.hostname || "").length && u.includes(client.options.hostname)) || "";
  const user = {id: async () => uid, can: async () => true, canEdit: async () => true, isOwner: async () => true};
  return {db, room, user};
}

/* ================= 부팅 ================= */
async function boot(){
  render();
  if(!window.claude?.use){
    if(location.hash === "#demo"){ installMock(); S.demo = true; }
    else {
      S.standalone = true; render();
      try{
        const v = (await (await fetch("version.txt?t=" + Date.now(), {cache:"no-store"})).text()).trim();
        if(v && v !== APP_VER && sessionStorage.getItem("hw-reload") !== v){ sessionStorage.setItem("hw-reload", v); location.replace(location.pathname + "?v=" + v + location.hash); return; }
      }catch{}
      const sa = await makeStandalone();
      if(!sa){ S.noRuntime = true; render(); return; }
      window.claude = {use: async n => ({db:sa.db, room:sa.room, user:sa.user})[n] ?? null};
    }
  }
  const [db, room, user, sample] = await Promise.all(["db", "room", "user", "sample"].map(n => window.claude.use(n).catch(() => null)));
  Object.assign(S, {db, room, user, sample});
  S.uid = (user && await user.id().catch(() => null)) || LS.get("anon", null);
  if(!S.uid){ S.uid = "a" + Math.random().toString(36).slice(2, 12); LS.set("anon", S.uid); }
  S.canWrite = user ? await user.can("data.write").catch(() => null) : null;
  if(room){
    room.onPeers(() => { S.peers = room.peers(); if(S.isHost) hostKick(); render(); }, () => { S.peers = []; render(); });
  }
  S.ready = true;
  if(S.code && db) joinGame(S.code, true); else render();
  setInterval(tickClock, 250);
  setInterval(() => { maybeTakeOver(); if(S.isHost) hostKick(); giverJudge(); }, 1000);
  document.addEventListener("visibilitychange", () => {
    if(document.hidden){ S.hiddenAt = Date.now(); return; }
    const away = S.hiddenAt ? Date.now() - S.hiddenAt : 0; S.hiddenAt = 0;
    if(S.code && away > 4000){
      if(S.isHost){ S.isHost = false; S.H = null; }
      S.hostSeen = Date.now();
      joinGame(S.code, true);
    }
    if(S.isHost) wake();
  });
}

/* ================= 방 만들기 / 입장 ================= */
const CODECH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
async function createGame(){
  const nick = cleanNick($("#nick")?.value || S.nick);
  if(!nick) return toast("닉네임을 먼저 적어 주세요");
  S.nick = nick; LS.set("nick", nick);
  if(!S.db || !S.room) return toast("이 화면에서는 실시간 연결을 쓸 수 없어요");
  let code = "";
  for(let i = 0; i < 5; i++){
    code = Array.from({length:4}, () => CODECH[Math.floor(Math.random() * CODECH.length)]).join("");
    const ex = await S.db.doc("hw/" + code).get().catch(() => null);
    if(ex && !ex.exists) break;
  }
  const H = {v:1, code, gid: Math.random().toString(36).slice(2, 8), hostUid:S.uid, phase:"lobby", settings:{...DEFAULTS},
    players:{[S.uid]:{nick, score:0, chances:DEFAULTS.chances, picked:0, joined:Date.now()}},
    order:[], round:1, turnIdx:0, turn:null, log:[], createdAt:Date.now(), hostNow:Date.now()};
  try{ await S.db.doc("hw/" + code).set(H); }
  catch(e){ return toast(e?.code === "invalid_argument" ? "이 계정은 방을 만들 권한이 없어요. 친구가 만든 방 코드로 들어가 주세요" : "방을 만들지 못했어요. 다시 시도해 주세요"); }
  S.H = H; S.isHost = true;
  joinGame(code);
  wake();
}
function joinGame(code, silent){
  code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if(!/^[A-Z0-9]{4}$/.test(code)){ if(!silent) toast("방 코드 4자리를 확인해 주세요"); return; }
  if(!silent){
    const nick = cleanNick($("#nick")?.value || S.nick);
    if(!nick) return toast("닉네임을 먼저 적어 주세요");
    S.nick = nick; LS.set("nick", nick);
  }
  if(!S.nick){ S.code = ""; render(); return; }
  S.unsub?.(); S.code = code; LS.set("code", code); S.loading = true; S.loadErr = ""; render();
  const timer = setTimeout(() => { if(S.loading){ S.loading = false; S.loadErr = "방 정보를 아직 못 받았어요. 연결을 확인해 주세요."; render(); } }, 10000);
  S.unsub = S.db.doc("hw/" + code).onSnapshot(snap => {
    if(!snap.metadata.fromCache){ clearTimeout(timer); S.loading = false; S.loadErr = ""; }
    if(!snap.exists){
      if(!snap.metadata.fromCache){ if(!silent) toast("그 코드의 방을 찾을 수 없어요"); leaveGame(true); }
      return;
    }
    const g = snap.data();
    if(!snap.metadata.fromCache && !snap.metadata.hasPendingWrites && g.hostNow && g.hostUid !== S.uid) S.offset = g.hostNow - Date.now();
    S.G = g;
    if(g.hostUid === S.uid){
      if(!S.isHost || !S.H){ S.H = clone(g); S.isHost = true; resumeHost(); }
    } else { S.isHost = false; S.H = null; }
    onGame();
    render();
  }, () => { clearTimeout(timer); S.loading = false; S.loadErr = "방 연결이 끊겼어요. 다시 입장해 주세요."; render(); });
  pres({g:code, nick:S.nick});
}
function leaveGame(quiet){
  S.unsub?.(); S.unsub = null; S.G = null; S.H = null; S.isHost = false; S.code = ""; LS.set("code", "");
  pres({g:null, pk:null, act:null, gs:null, jd:null, cfg:null, start:null, again:null});
  S.pendingK = null; render();
  if(!quiet) toast("방에서 나왔어요");
}

/* 참가자 쪽 반응 */
function onGame(){
  const G = game(); if(!G) return;
  if(S.pendingK && G.turn && (G.turn.seen || []).includes(S.pendingK)) { S.pendingK = null; S.pendingW = ""; }
  if(S.pendingK && (!G.turn || G.phase !== "hint")) { S.pendingK = null; S.pendingW = ""; }
  if(G.phase !== "guess") S.chanceOn = false;
  if(G.phase !== "lobby" && G.phase !== "final") loadDict().catch(() => {});
  giverJudge();
}

/* ================= 자동 진행 엔진 =================
   진행자는 없다. 방에 있는 폰 중 하나(처음엔 방을 만든 폰)가 보이지 않게 타이머·차례만 굴리고,
   그 폰이 나가면 남은 폰 중 하나가 자동으로 이어받는다. 엔진 폰은 누구의 히든 워드도 모른다.
   힌트 채점과 정답 판정은 그 단어의 주인(출제자) 폰이 자동으로 한다. */
let commitChain = Promise.resolve(), commitQueued = false;
function commit(){
  render();
  if(commitQueued) return;
  commitQueued = true;
  setTimeout(() => {
    commitQueued = false;
    const H = S.H; if(!H) return;
    H.hostNow = Date.now();
    const body = clone(H), code = H.code;
    commitChain = commitChain.then(() => S.db.doc("hw/" + code).set(body)).catch(e => toast("저장 실패: " + (e?.code || "연결")));
  }, 60);
}
function resumeHost(){
  const T = S.H.turn;
  if(T && S.H.phase === "judging" && !T.jdl) T.jdl = Date.now() + 40000;
  commit(); wake();
}
let wakeLock = null;
async function wake(){ try{ if(!wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener?.("release", () => wakeLock = null); } }catch{} }

function here(){ return (S.peers || []).filter(p => p.presence?.app === "hw" && p.presence?.g === S.code); }
const uidOf = p => p.by || (typeof p.presence?.uid === "string" ? p.presence.uid.slice(0, 80) : null);
function presOf(uid){ let best = null; for(const p of here()) if(uidOf(p) === uid && (!best || p.updatedAt > best.updatedAt)) best = p; return best?.presence || null; }
function onlineSet(){
  const s = new Set(here().map(uidOf).filter(Boolean));
  if(S.uid && S.code && S.myPres.g === S.code) s.add(S.uid);
  return s;
}

/* 엔진 폰이 사라지면 남은 사람 중 한 명(아이디 순 첫 번째)이 이어받는다 */
function maybeTakeOver(){
  const G = S.G;
  if(!G || S.isHost || !S.code || G.phase === "final") return;
  if(onlineSet().has(G.hostUid)){ S.hostSeen = Date.now(); return; }
  if(!S.hostSeen) S.hostSeen = Date.now();
  if(Date.now() - S.hostSeen < 10000) return;
  const cand = [...onlineSet()].sort()[0];
  if(cand !== S.uid) return;
  S.H = clone(G); S.H.hostUid = S.uid; S.isHost = true;
  resumeHost();
}

let hostBusy = false;
async function hostKick(){
  if(!S.isHost || !S.H || hostBusy) return;
  hostBusy = true;
  try{ await hostStep(); }catch(e){ console.error(e); }
  finally{ hostBusy = false; }
}
const SETTING_KEYS = {rounds:[1, 3], maxTries:[5, 10], hintSec:[60, 900], guessSec:[30, 300], chances:[0, 3]};
function applyCfg(H, k, v){
  if(H.phase !== "lobby") return false;
  if(k in SETTING_KEYS){ const [lo, hi] = SETTING_KEYS[k]; const n = Math.round(Number(v)); if(!Number.isFinite(n)) return false; H.settings[k] = Math.max(lo, Math.min(hi, n)); if(k === "chances") Object.values(H.players).forEach(p => p.chances = H.settings.chances); return true; }
  if(k === "english" || k === "lenient"){ H.settings[k] = !!v; return true; }
  if(k === "ai" && ["auto", "claude", "fast", "dict"].includes(v)){ H.settings.ai = v; return true; }
  return false;
}
async function hostStep(){
  const H = S.H, now = Date.now(); let dirty = false;
  H.seenReq ||= {};
  const on = onlineSet();
  // 1) 참가자 등록·닉네임
  for(const p of here()){
    const u = uidOf(p); if(!u) continue;
    const nick = cleanNick(p.presence.nick) || "플레이어";
    if(!H.players[u]){ H.players[u] = {nick, score:0, chances:H.settings.chances, picked:0, joined:now}; dirty = true; }
    else if(H.players[u].nick !== nick){ H.players[u].nick = nick; dirty = true; }
  }
  // 2) 누구나 보내는 요청: 설정 변경·시작·새 게임 (같은 요청은 한 번만)
  for(const p of here()){
    const u = uidOf(p), pr = p.presence; if(!u || !H.players[u]) continue;
    for(const kind of ["cfg", "start", "again"]){
      const req = pr[kind]; if(!req || typeof req.t !== "number") continue;
      const key = `${u}:${kind}`; if((H.seenReq[key] || 0) >= req.t) continue;
      H.seenReq[key] = req.t; dirty = true;
      if(kind === "cfg") applyCfg(H, req.k, req.v);
      if(kind === "start" && H.phase === "lobby") await startGame(req.eng);
      if(kind === "again" && H.phase === "final") newGame();
    }
  }
  // 3) 단어를 골랐다는 신호(단어 자체는 오지 않는다)
  for(const p of here()){
    const u = uidOf(p);
    if(u && H.players[u] && p.presence.pk === `${H.gid}:${H.round}` && H.players[u].picked !== H.round){ H.players[u].picked = H.round; dirty = true; }
  }
  const T = H.turn;
  if(H.phase === "pick"){
    const pend = Object.keys(H.players).filter(u => on.has(u) && H.players[u].picked !== H.round);
    const ready = Object.keys(H.players).filter(u => H.players[u].picked === H.round && on.has(u));
    if(ready.length >= 2 && (pend.length === 0 || now >= H.pickDl)){ startRoundTurns(); return; }
  }
  // 출제자가 20초 넘게 안 보이면 그 턴은 자동으로 넘긴다
  if(T && ["hint", "guess", "judging"].includes(H.phase)){
    if(on.has(T.giver)) T.goneAt = 0;
    else if(!T.goneAt){ T.goneAt = now; dirty = true; }
    else if(now - T.goneAt > 20000){ skipTurn("출제자 연결이 끊겨 이 턴은 넘어가요"); return; }
  }
  if(H.phase === "hint" && T){
    const act = presOf(T.giver)?.act;
    if(act && typeof act.k === "string" && act.k.startsWith(`${T.id}.${T.stage}.`) && !T.seen.includes(act.k)){
      T.seen.push(act.k); if(T.seen.length > 60) T.seen.shift();
      const w = checkWord(deobf(act.w, H.gid), {english:H.settings.english}).w;
      const used = w && T.tries.some(t => deobf(t.w, H.gid) === w);
      const r = act.r || {}, sc = Number(r.s), ok = !!r.ok && Number.isFinite(sc) && !!w && !used;
      T.tries.push({w: obf(w || "?", H.gid), st:T.stage, ok, s: ok ? roundHalf(sc) : null,
        note: typeof r.n === "string" ? r.n.slice(0, 400) : "", reason: ok ? "" : (typeof r.e === "string" && r.e ? r.e.slice(0, 200) : obf(used ? "이미 시도한 단어" : "힌트로 쓸 수 없는 단어", H.gid))});
      const validN = T.tries.filter(t => t.st === T.stage && t.ok).length;
      if(ok && sc >= 95){ endHint(); return; }
      if(validN >= H.settings.maxTries){ endHint(); return; }
      commit(); return;
    }
    if(now >= T.deadline){ endHint(); return; }
  }
  if(H.phase === "guess" && T){
    const guessers = Object.keys(H.players).filter(u => u !== T.giver && on.has(u));
    const done = guessers.filter(u => { const g = presOf(u)?.gs; return g && g.k === T.gkey && g.done; });
    if(now >= T.deadline || (guessers.length > 0 && done.length >= guessers.length)){ collectGuesses(); return; }
  }
  if(H.phase === "judging" && T){
    const jd = presOf(T.giver)?.jd;
    if(jd && jd.k === T.gkey){ finalize(jd); return; }
    if(now >= T.jdl){ skipTurn("출제자 폰이 채점하지 못해 이 턴은 넘어가요"); return; }
  }
  if(H.phase === "result" && T && now >= T.deadline){ advance(); return; }
  if(H.phase === "roundEnd" && now >= H.roundDl){ H.round++; startPick(); return; }
  if(dirty) commit();
}
async function startGame(eng){
  const H = S.H, on = onlineSet();
  if(Object.keys(H.players).filter(u => on.has(u)).length < 2) return;
  H.engine = eng === "claude" && H.settings.ai !== "dict" ? "claude" : "dict";
  H.round = 1; startPick();
}
function startPick(){
  const H = S.H;
  H.phase = "pick"; H.turn = null; H.pickDl = Date.now() + 90000; commit();
}
function newGame(){
  const H = S.H;
  H.gid = Math.random().toString(36).slice(2, 8);
  Object.values(H.players).forEach(p => { p.score = 0; p.chances = H.settings.chances; p.picked = 0; });
  Object.assign(H, {phase:"lobby", round:1, turnIdx:0, order:[], turn:null, log:[]});
  commit();
}
function startRoundTurns(){
  const H = S.H, on = onlineSet();
  H.order = shuffle(Object.keys(H.players).filter(u => H.players[u].picked === H.round && on.has(u))); H.turnIdx = 0;
  startTurn();
}
function startTurn(){
  const H = S.H, on = onlineSet();
  while(H.turnIdx < H.order.length && !(on.has(H.order[H.turnIdx]) && H.players[H.order[H.turnIdx]]?.picked === H.round)) H.turnIdx++;
  if(H.turnIdx >= H.order.length){
    H.turn = null;
    if(H.round < H.settings.rounds){ H.phase = "roundEnd"; H.roundDl = Date.now() + 15000; }
    else H.phase = "final";
    commit(); return;
  }
  const giver = H.order[H.turnIdx];
  H.turn = {id:`${H.round}-${H.turnIdx}`, giver, stage:1, tries:[], revealed:[], seen:[], deadline: Date.now() + H.settings.hintSec * 1000, dur: H.settings.hintSec * 1000, gkey:"", subs:null, res:null, gain:null, end:null, answer:null};
  H.phase = "hint"; commit();
}
function endHint(){
  const H = S.H, T = H.turn;
  const best = T.tries.filter(t => t.st === T.stage && t.ok).sort((a, b) => b.s - a.s)[0];
  T.revealed.push(best ? {w: deobf(best.w, H.gid), s: best.s, st:T.stage, note: best.note || ""} : {w:null, s:null, st:T.stage});
  T.gkey = `${T.id}.${T.stage}`;
  T.deadline = Date.now() + H.settings.guessSec * 1000; T.dur = H.settings.guessSec * 1000;
  H.phase = "guess"; commit();
}
/* 추리 마감: 답안만 모아 두고, 채점은 출제자 폰이 한다 */
function collectGuesses(){
  const H = S.H, T = H.turn, subs = {};
  for(const u of Object.keys(H.players)){
    if(u === T.giver) continue;
    const g = presOf(u)?.gs;
    if(!g || g.k !== T.gkey || !Array.isArray(g.ws)) continue;
    const ws = [...new Set(g.ws.slice(0, 2).map(x => checkWord(deobf(x, H.gid), {english:true}).w).filter(Boolean))];
    const use = ws.slice(0, 1 + (H.players[u].chances > 0 ? 1 : 0));
    if(use.length === 2) H.players[u].chances--;
    if(use.length) subs[u] = use.map(w => obf(w, H.gid));
  }
  T.subs = subs; T.jdl = Date.now() + 40000;
  H.phase = "judging"; commit();
}
function finalize(jd){
  const H = S.H, T = H.turn, mult = H.round, res = {}, winners = [];
  for(const [u, arr] of Object.entries(T.subs || {})){
    const got = Array.isArray(jd.res?.[u]) ? jd.res[u] : [];
    res[u] = arr.map((ow, i) => {
      const w = deobf(ow, H.gid), x = got[i] || {};
      return {w, ok: !!x.ok, s: Number.isFinite(Number(x.s)) && x.s !== null ? roundHalf(Number(x.s)) : null, how: String(x.how || "").slice(0, 12), note: typeof x.note === "string" ? x.note.slice(0, 300) : ""};
    });
    if(res[u].some(x => x.ok)) winners.push(u);
  }
  T.res = res; T.gain = {}; T.aiFail = !!jd.f;
  if(winners.length){ winners.forEach(u => { H.players[u].score += mult; T.gain[u] = mult; }); T.end = "solved"; }
  else { const pts = T.stage * mult; H.players[T.giver].score += pts; T.gain[T.giver] = pts; T.end = T.stage >= 3 ? "escaped" : null; }
  if(T.end){
    T.answer = checkWord(deobf(jd.a || "", H.gid), {english:true}).w || null;
    H.log.push({r:H.round, giver:T.giver, answer:T.answer, hints:T.revealed.map(h => h.w ? `${h.w} ${fmtS(h.s)}%` : "힌트 없음"), winners, end:T.end});
  }
  T.deadline = Date.now() + 15000; T.dur = 15000;
  H.phase = "result"; commit();
}
function skipTurn(msg){
  const H = S.H, T = H.turn; if(!T) return;
  T.end = "skipped"; T.skipMsg = msg; T.res = T.res || {}; T.gain = {};
  H.log.push({r:H.round, giver:T.giver, answer:null, hints:T.revealed.map(h => h.w ? `${h.w} ${fmtS(h.s)}%` : "힌트 없음"), winners:[], end:"skipped"});
  T.deadline = Date.now() + 8000; T.dur = 8000; H.phase = "result"; commit();
}
function advance(){
  const H = S.H, T = H.turn;
  if(T && !T.end){
    T.stage++; T.deadline = Date.now() + H.settings.hintSec * 1000; T.dur = H.settings.hintSec * 1000; T.res = null; T.gain = null; T.subs = null;
    H.phase = "hint"; commit(); return;
  }
  H.turnIdx++; startTurn();
}

/* 출제자 폰: 추리 마감되면 내 단어로 답안을 자동 채점해 올린다 */
async function giverJudge(){
  const G = game(); const T = G?.turn;
  if(!T || G.phase !== "judging" || T.giver !== S.uid || !T.subs || S.judgedK === T.gkey) return;
  S.judgedK = T.gkey;
  const ans = myWord(G);
  if(!ans){ toast("이 폰에 내 히든 워드 기록이 없어 채점할 수 없어요"); return; }
  const subs = {}; for(const [u, arr] of Object.entries(T.subs)) subs[u] = arr.map(x => deobf(x, G.gid));
  const uniq = [...new Set(Object.values(subs).flat())].filter(w => w !== norm(ans));
  let sc = {}, fail = false;
  try{ sc = await scoreLocal(ans, uniq, G, true); }catch{ fail = true; }
  const mk = withNote => { const res = {}; for(const [u, ws] of Object.entries(subs)) res[u] = ws.map(w => {
    if(w === norm(ans)) return {ok:true, s:100, how:"정확"};
    const a = sc[w], ok = !!(G.settings.lenient && a?.same);
    return {ok, s: a ? a.s : null, how: ok ? "표기·번역 인정" : "", note: withNote && a ? obf(explain(a).slice(0, 40), G.gid) : ""};
  }); return res; };
  const jd = r => ({k:T.gkey, res:r, a:obf(ans, G.gid), f:fail});
  S.myPres.jd = jd(mk(true));
  try{ await S.room.presence({app:"hw", uid:S.uid, jd:S.myPres.jd}); }
  catch{ S.myPres.jd = jd(mk(false)); S.room.presence({app:"hw", uid:S.uid, jd:S.myPres.jd}).catch(() => {}); }
}

function tickClock(){
  const G = game();
  document.querySelectorAll("[data-deadline]").forEach(el => {
    const left = Math.max(0, Number(el.dataset.deadline) - nowHost());
    const sec = Math.ceil(left / 1000);
    el.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
    el.classList.toggle("low", sec <= 15);
  });
  document.querySelectorAll("[data-prog]").forEach(el => {
    const left = Math.max(0, Number(el.dataset.prog) - nowHost()), dur = Number(el.dataset.dur) || 1;
    el.style.width = `${Math.min(100, left / dur * 100)}%`;
    el.classList.toggle("low", left <= 15000);
  });
}

function rulesBlock(open){
  return `<details class="rules" ${open ? "open" : ""}><summary>게임 방법</summary>
  <ol>
    <li><b>단어 고르기</b> — 각자 봉투(일반 명사 5개)에서 히든 워드 1개를 몰래 고릅니다. 2라운드엔 남은 단어 중에서.</li>
    <li><b>힌트 찾기</b> — 출제자는 제한 시간 안에 힌트 단어를 최대 10번 시도합니다. 시도와 유사도는 <b>출제자만</b> 봅니다.</li>
    <li><b>95%의 벽</b> — 유사도 95% 이상이 나오면 그 단어가 즉시 공개됩니다. 10번 안에 못 넘기면 가장 높았던 단어가 공개돼요.</li>
    <li><b>추리</b> — 나머지는 공개된 힌트(단어 + %)만 보고 동시에 답을 냅니다. 찬스를 쓰면 한 단어 더.</li>
    <li><b>점수</b> — 맞힌 사람마다 +1점, 그 턴 끝. 아무도 못 맞히면 출제자가 +1(1차)·+2(2차)·+3(3차)점을 받고 다음 힌트로. 3차까지.</li>
    <li><b>2라운드는 모든 점수 ×2</b>. 마지막 점수가 가장 높은 사람이 우승.</li>
  </ol>
  <p class="small muted"><b>AI 유사도는 이렇게 매겨요</b> · ① 정답의 모든 뜻을 먼저 펼칩니다(유성 = 별똥별 流星 / 기름 성질 油性 → 유성매직). ② 정답에서 힌트까지 가장 강한 연상 경로를 찾고, 고리가 하나 늘 때마다 점수가 식어요(유성 → 유성매직 → 마법 → 해리포터). ③ 글자가 겹치면 따로 점수를 줍니다(유성 ↔ 성, 소나무 ↔ 나무). 셋 중 가장 강한 근거가 최종 %가 돼요. 띄어쓰기는 무시. 정답 그 자체, 번역어(tree↔나무), 표기 변형(케익↔케이크)은 힌트로 못 써요. 유의어(나무↔수목)는 힌트로 쓸 수 있지만 정답으로는 인정되지 않습니다. 영어 힌트는 방 설정에서 켤 수 있어요.</p>
  <p class="fine">규칙은 데블스 플랜 '히든 워드'를 정리한 공개 자료(나무위키 요약) 기준이며, 방송에서 명확하지 않은 부분(점수 누적 방식 등)은 위처럼 정했습니다. 팬이 만든 비공식 게임입니다.</p>
  </details>`;
}

function envelope(G){
  const r = rng(hashStr(`${S.uid}|${G.gid}`));
  const pool = shuffle(WORDS, r).slice(0, 5);
  const used = [];
  for(let i = 1; i < G.round; i++){ const w = LS.get(`pick:${G.gid}:${i}`, null); if(w) used.push(w); }
  return pool.filter(w => !used.includes(w));
}
function viewPick(G){
  const me = G.players[S.uid], on = onlineSet();
  const doneList = `<div class="plist">${Object.entries(G.players).filter(([u]) => on.has(u) || G.players[u].picked === G.round).map(([u, p]) => `<div class="pl"><span class="nm">${esc(p.nick)}</span><span class="st ${p.picked === G.round ? "ok" : ""}">${p.picked === G.round ? "선택 완료" : "고르는 중"}</span></div>`).join("")}</div>`;
  if(!me) return `<div class="card"><p class="muted pulse">방에 들어가는 중…</p></div>`;
  if(me.picked === G.round || S.myPres.pk === `${G.gid}:${G.round}`){
    const w = LS.get(`pick:${G.gid}:${G.round}`, "");
    return `<div class="card stack"><p class="eyebrow">${G.round}라운드 히든 워드</p>
      ${secretBox(w)}
      <p class="muted small">이 단어는 내 폰에만 저장되고 누구에게도 보내지 않아요. 다른 사람을 기다리는 중.</p></div>
      <div class="card">${doneList}</div>`;
  }
  const env = envelope(G);
  return `<div class="card stack">
    <div><p class="eyebrow">${G.round}라운드 · 봉투를 열었어요</p><h2 class="title">숨길 단어를 하나 고르세요</h2>
    <p class="muted small">친구들이 맞히기 어렵지만, 95% 힌트는 찾을 수 있는 단어가 좋아요. 동음이의어도 무기가 됩니다.</p></div>
    <div class="env">${env.map(w => `<button class="wc" data-act="pick" data-w="${esc(w)}" aria-pressed="${S.pickSel === w}">${esc(w)}</button>`).join("")}</div>
    ${G.engine === "claude" ? `<button class="btn ghost sm" style="align-self:flex-start" data-act="custom">${S.customOpen ? "봉투에서 고르기" : "직접 입력하기"}</button>` : `<p class="fine">내장 사전으로 채점하는 방이라 봉투 단어만 쓸 수 있어요.</p>`}
    ${S.customOpen ? `<input class="in" id="custom" maxlength="10" placeholder="고유명사 말고 일반 명사" data-enter="confirmPick">` : ""}
    <button class="btn" data-act="confirmPick">이 단어로 숨기기</button>
  </div>
  <div class="card">${doneList}</div>`;
}
function secretBox(w){
  return `<div class="secret"><span class="w ${S.reveal ? "" : "mask"}">${S.reveal ? esc(w || "이 기기에 기록 없음") : "● ● ●"}</span><button class="btn ghost sm" data-act="reveal">${S.reveal ? "가리기" : "보기"}</button></div>`;
}
function revealedTiles(G, label = true){
  const R = G.turn?.revealed || [];
  if(!R.length) return "";
  return `<div class="hint-tiles">${R.map(h => `<div class="tile"><div style="min-width:0">${label ? `<div class="lb">${h.st}차 공개 힌트</div>` : ""}<div class="w">${h.w ? esc(h.w) : "힌트 없음"}</div>${G.turn?.answer && h.note ? `<div class="fine">${esc(deobf(h.note, G.gid))}</div>` : ""}</div><div class="s" style="color:${heat(h.s)}">${h.s == null ? "" : fmtS(h.s) + "%"}</div></div>`).join("")}</div>`;
}
function viewHint(G){
  const T = G.turn, mine = T.giver === S.uid, s = G.settings, mult = G.round;
  const stageTries = T.tries.filter(t => t.st === T.stage);
  const validN = stageTries.filter(t => t.ok).length;
  if(mine){
    const w = LS.get(`pick:${G.gid}:${G.round}`, "");
    const waiting = S.pendingK || S.scoring;
    const list = T.tries.slice().reverse().map(t => {
      const word = deobf(t.w, G.gid), note = deobf(t.note || "", G.gid), reason = deobf(t.reason || "", G.gid);
      return `<div class="try ${t.ok ? "" : "bad"}"><div class="w">${esc(word)}${t.st !== T.stage ? `<span class="tag">${t.st}차</span>` : ""}${t.ok && t.s >= 95 ? `<span class="tag hot">공개 확정</span>` : ""}</div><div class="s" style="color:${heat(t.ok ? t.s : null)}">${t.ok ? fmtS(t.s) + "%" : "불가"}</div>${t.ok ? meter(t.s) : ""}<div class="note">${esc(t.ok ? note : reason)}</div></div>`;
    }).join("");
    return `<div class="card stack">
      <div class="row" style="justify-content:space-between"><p class="eyebrow">${T.stage}차 힌트 · 남은 시도</p><span class="chip"><strong class="num">${Math.max(0, s.maxTries - validN)}</strong> / ${s.maxTries}번</span></div>
      ${secretBox(w)}
      <div class="combo"><input class="in" id="hint" maxlength="20" placeholder="힌트 단어 입력" autocomplete="off" enterkeyhint="send" data-enter="hint" ${waiting ? "disabled" : ""}><button class="btn" data-act="hint" ${waiting ? "disabled" : ""}>재기</button></div>
      ${waiting ? `<div class="row small"><span class="spin"></span><span>‘${esc(S.pendingW || "…")}’ 유사도를 재는 중 (${engineName(G)})</span></div>` : ""}
      <p class="small muted">95% 이상 → 그 단어가 바로 공개. 못 넘기면 가장 높은 단어가 공개돼요. 아무도 못 맞히면 내가 <b>+${T.stage * mult}점</b>.</p>
      ${T.aiErr ? `<p class="small" style="color:var(--hot)">${esc(T.aiErr)} — 같은 단어를 다시 넣어 주세요</p>` : ""}
    </div>
    ${list ? `<div class="card"><p class="eyebrow" style="margin-bottom:4px">내 시도 · 나만 보여요</p>${list}</div>` : ""}
    ${T.revealed.length ? `<div class="stack"><p class="eyebrow">이미 공개된 힌트</p>${revealedTiles(G)}</div>` : ""}
    ${stageDots(G)}`;
  }
  return `<div class="card stack">
    <p class="eyebrow">${T.stage}차 힌트 탐색</p>
    <h2 class="title">${nickOf(G, T.giver)} 님이 95% 힌트를 찾는 중</h2>
    <div class="row"><span class="spin"></span><span class="muted">시도 <b class="num">${validN}</b> / ${s.maxTries}번</span></div>
    <p class="small muted">아무도 못 맞히면 출제자 +${T.stage * mult}점. 맞히면 맞힌 사람마다 +${mult}점.</p>
  </div>
  ${T.revealed.length ? `<div class="stack"><p class="eyebrow">지금까지 공개된 힌트</p>${revealedTiles(G)}</div>` : ""}
  ${stageDots(G)}`;
}
function viewGuess(G){
  const T = G.turn, mine = T.giver === S.uid, me = G.players[S.uid], on = onlineSet();
  const statusList = `<div class="plist">${Object.entries(G.players).filter(([u]) => u !== T.giver && on.has(u)).map(([u, p]) => { const g = u === S.uid ? S.myPres.gs : presOf(u)?.gs; const d = g && g.k === T.gkey && g.done; return `<div class="pl"><span class="nm">${esc(p.nick)}</span><span class="st ${d ? "ok" : ""}">${d ? "제출" : "생각 중"}</span></div>`; }).join("")}</div>`;
  const tiles = `<div class="stack"><p class="eyebrow">공개된 힌트</p>${revealedTiles(G)}</div>`;
  if(mine) return `${tiles}<div class="card stack"><p class="eyebrow">친구들이 추리하는 중</p>${statusList}</div>`;
  if(!me) return `${tiles}<div class="card"><p class="muted">관전 중이에요. 다음 라운드부터 참가해요.</p></div>`;
  const g = S.myPres.gs;
  if(g && g.k === T.gkey && g.done){
    const ws = LS.get(`gs:${T.gkey}`, []);
    return `${tiles}<div class="card stack"><p class="eyebrow">제출 완료</p><p class="title">${ws.map(esc).join(" · ")}</p><p class="muted small">모두 제출하거나 시간이 끝나면 채점해요.</p>${statusList}</div>`;
  }
  const canChance = me.chances > 0;
  return `${tiles}
  <div class="card stack">
    <div><p class="eyebrow">${nickOf(G, T.giver)} 님의 히든 워드는?</p><p class="small muted">띄어쓰기는 무시해요.${G.settings.lenient ? " 표기 변형·영어 번역도 정답으로 쳐요." : ""}</p></div>
    <input class="in" id="g1" maxlength="20" placeholder="정답이라고 생각하는 단어" autocomplete="off" enterkeyhint="done" data-enter="guess">
    ${S.chanceOn ? `<input class="in" id="g2" maxlength="20" placeholder="찬스: 한 단어 더" autocomplete="off" data-enter="guess">` : ""}
    <div class="row"><button class="btn ghost sm" data-act="chance" ${canChance ? "" : "disabled"}>${S.chanceOn ? "찬스 취소" : `찬스 쓰기 (남은 ${me.chances})`}</button></div>
    <button class="btn" data-act="guess">제출하기</button>
  </div>
  <div class="card">${statusList}</div>`;
}
function viewJudging(G){
  return `${revealedTiles(G)}<div class="card row"><span class="spin"></span><span>답안을 채점하는 중…</span></div>`;
}
function viewResult(G){
  const T = G.turn, res = T.res || {}, gain = T.gain || {};
  const winners = Object.keys(res).filter(u => res[u].some(x => x.ok));
  let banner;
  if(T.end === "skipped") banner = `<div class="banner info">${esc(T.skipMsg || "이 턴은 넘어가요")}</div>`;
  else if(winners.length) banner = `<div class="banner win">${winners.map(u => nickOf(G, u)).join(", ")} 정답! 각 +${G.round}점</div>`;
  else banner = `<div class="banner lose">아무도 못 맞혔어요 · ${nickOf(G, T.giver)} +${gain[T.giver] || 0}점${T.end ? "" : ` · ${T.stage + 1}차 힌트로`}</div>`;
  const rows = Object.entries(res).map(([u, list]) => `<div class="res"><div class="who"><span>${nickOf(G, u)}</span>${gain[u] ? `<span class="tag ok">+${gain[u]}</span>` : ""}</div>${list.map(x => `<div class="gw"><span class="w">${esc(x.w)} ${x.ok ? `<span class="tag ok">${esc(x.how || "정답")}</span>` : ""}</span><span class="s" style="color:${heat(x.s)}">${x.ok ? "정답" : x.s == null ? "–" : fmtS(x.s) + "%"}</span></div>${!x.ok && x.s != null ? meter(x.s) : ""}${x.note && !x.ok && T.answer ? `<div class="fine">${esc(deobf(x.note, G.gid))}</div>` : ""}`).join("")}</div>`).join("");
  return `${banner}
  ${T.answer ? `<div class="card center stack"><p class="eyebrow">${nickOf(G, T.giver)} 님의 히든 워드</p><p class="big">${esc(T.answer)}</p></div>` : ""}
  ${revealedTiles(G)}
  ${rows ? `<div class="card"><p class="eyebrow" style="margin-bottom:4px">답안과 정답 유사도</p>${rows}</div>` : `<div class="card muted">제출된 답이 없어요.</div>`}
  ${T.aiFail ? `<p class="fine">AI 판정에 실패해 글자가 정확히 같은 답만 인정했어요.</p>` : ""}
  <p class="fine center">잠시 후 자동으로 넘어가요</p>`;
}
function rankList(G){
  const list = Object.entries(G.players).sort((a, b) => b[1].score - a[1].score);
  let rank = 0, prev = null;
  return `<div class="podium">${list.map(([u, p], i) => { if(p.score !== prev){ rank = i + 1; prev = p.score; } return `<div class="pd ${rank === 1 ? "first" : ""}"><span class="rk">${rank}</span><span class="nm">${esc(p.nick)}${u === S.uid ? " (나)" : ""}</span><span class="n">${p.score}</span></div>`; }).join("")}</div>`;
}
function logList(G){
  if(!G.log?.length) return "";
  return `<div class="card stack"><p class="eyebrow">턴 기록</p><div class="log">${G.log.map(l => `<div class="lg">R${l.r} · ${nickOf(G, l.giver)}의 <b>${esc(l.answer || "?")}</b><br><span class="muted small">힌트: ${l.hints.map(esc).join(" → ")} · ${l.end === "solved" ? `정답자 ${l.winners.map(u => nickOf(G, u)).join(", ")}` : l.end === "skipped" ? "건너뜀" : "아무도 못 맞힘"}</span></div>`).join("")}</div></div>`;
}
function viewRoundEnd(G){
  return `<div class="card stack center"><p class="eyebrow">${G.round}라운드 종료</p><h2 class="title">다음 라운드는 모든 점수 ×${G.round + 1}</h2></div>
  ${rankList(G)}${logList(G)}
  <div class="card row"><span class="spin"></span><span class="muted">잠시 후 ${G.round + 1}라운드가 자동으로 시작돼요</span></div>`;
}
function viewFinal(G){
  const top = Object.entries(G.players).sort((a, b) => b[1].score - a[1].score)[0];
  return `<div class="card stack center"><p class="eyebrow">최종 우승</p><p class="big">${top ? esc(top[1].nick) : "-"}</p></div>
  ${rankList(G)}${logList(G)}
  <button class="btn" data-act="again">같은 멤버로 새 게임</button>
  <button class="btn ghost" data-act="leave">방 나가기</button>`;
}
function hostBar(G){
  const inf = S.room?.info?.();
  const diag = S.standalone && inf ? `<p class="fine center">버전 ${APP_VER} · 서버 ${inf.server} · ${S.room.connected() ? "연결됨" : "재연결 중"} · 같은 방 신호 ${here().length}명</p>` : "";
  return (G && G.phase !== "final" ? `<button class="btn ghost sm" style="align-self:center" data-act="leave">방 나가기</button>` : "") + diag;
}

/* ================= 로컬 데모(#demo, claude.ai 밖에서만) ================= */
function installMock(){
  const store = {}, subs = {};
  const snap = p => ({id:p.split("/").pop(), exists: p in store, data: () => store[p] && clone(store[p]), metadata:{fromCache:false, hasPendingWrites:false}});
  const notify = p => setTimeout(() => (subs[p] || []).forEach(f => f(snap(p))), 40);
  const doc = p => ({path:p, get: async () => snap(p), set: async d => { store[p] = clone(d); notify(p); }, update: async d => { Object.assign(store[p], d); notify(p); }, delete: async () => { delete store[p]; notify(p); },
    onSnapshot: f => { (subs[p] ||= []).push(f); setTimeout(() => f(snap(p)), 40); return () => { subs[p] = subs[p].filter(x => x !== f); }; }});
  const ME = "me1"; let peers = []; const hs = [];
  const setPeer = (id, patch) => {
    const old = peers.find(p => p.by === id); const pr = {...(old?.presence || {}), ...patch};
    for(const k in patch) if(patch[k] === null) delete pr[k];
    const np = Object.freeze({peer:id, by:id, isMe:id === ME, sameTab:id === ME, kind:"viewer", guest:false, presence:Object.freeze(pr), updatedAt:Date.now()});
    peers = Object.freeze(peers.filter(p => p.by !== id).concat(np)); hs.forEach(h => h({peers}));
  };
  const room = {presence: async p => setPeer(ME, p), peers: () => peers, onPeers: h => { hs.push(h); setTimeout(() => h({peers}), 10); return () => {}; }};
  const user = {id: async () => ME, can: async () => true};
  const fake = (a, b) => b.includes(a) || a.includes(b) ? 96.5 : (hashStr(a + "|" + b) % 900) / 10;
  const sample = async () => ({text:""});
  sample.json = async prompt => {
    await sleep(500);
    const inp = JSON.parse(prompt.match(/INPUT_JSON: (.*)$/m)[1]);
    if(!inp.words) return {senses:[]};
    return inp.words.map(w => ({w, same:false, valid:true, reason:"", path:[inp.answer, w], s:[fake(inp.answer, w) / 100], why:"데모"}));
  };
  window.claude = {use: async n => ({db:{doc}, room, user, sample})[n] ?? null};
  const bots = [["b1", "민지"], ["b2", "준호"]], botSec = {};
  setInterval(() => {
    const path = Object.keys(store).find(k => /^hw\/[A-Z0-9]{4}$/.test(k)); if(!path) return;
    const G = store[path], T = G.turn;
    for(const [id, nick] of bots){
      const cur = peers.find(p => p.by === id)?.presence || {};
      if(cur.g !== G.code) setPeer(id, {app:"hw", g:G.code, uid:id, nick});
      const me = G.players[id]; if(!me) continue;
      const pk = `${G.gid}:${G.round}`;
      if(G.phase === "pick" && cur.pk !== pk){ botSec[pk + id] = WORDS[hashStr(id + pk) % WORDS.length]; setPeer(id, {pk}); }
      const sec = botSec[pk + id];
      if(G.phase === "hint" && T?.giver === id && (!cur.act || T.seen.includes(cur.act.k)) && Math.random() < .5){
        const w = WORDS[Math.floor(Math.random() * WORDS.length)];
        setPeer(id, {act:{k:`${T.id}.${T.stage}.${Date.now().toString(36)}`, w:obf(w, G.gid), r:{ok:true, s:fake(sec, w), n:obf("데모 채점", G.gid), e:""}}});
      }
      if(G.phase === "judging" && T?.giver === id && T.subs && cur.jd?.k !== T.gkey){
        const res = {}; for(const [u, arr] of Object.entries(T.subs)) res[u] = arr.map(x => { const w = deobf(x, G.gid); return w === sec ? {ok:true, s:100, how:"정확"} : {ok:false, s:fake(sec, w), how:"", note:obf("데모", G.gid)}; });
        setPeer(id, {jd:{k:T.gkey, res, a:obf(sec, G.gid), f:false}});
      }
      if(G.phase === "guess" && T?.giver !== id && !(cur.gs && cur.gs.k === T.gkey) && Math.random() < .5){
        const ans = T.giver === ME ? LS.get(`pick:${G.gid}:${G.round}`, null) : botSec[pk + T.giver];
        const w = Math.random() < .3 && ans ? ans : WORDS[Math.floor(Math.random() * WORDS.length)];
        setPeer(id, {gs:{k:T.gkey, ws:[obf(w, G.gid)], done:true}});
      }
    }
  }, 900);
}

boot();
</script>
